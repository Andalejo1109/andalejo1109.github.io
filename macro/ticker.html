<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cinta macro</title>
  <style>
    :root{--bg:#0B0E14;--line:#262E40;--txt:#ECEFF4;--mut:#8993A8;--go:#2BE8A8;--down:#FF5C72;--gold:#FFC857}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden}
    .mt-banner{background:linear-gradient(180deg,#121822 0%,#0B0E14 100%);border-bottom:1px solid var(--line)}
    .mt-inner{display:flex;align-items:stretch;min-height:52px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
    .mt-item{display:flex;flex-direction:column;justify-content:center;padding:8px 14px;border-right:1px solid var(--line);white-space:nowrap;flex-shrink:0;min-width:104px}
    .mt-trm{background:rgba(255,200,87,.1);border-right:2px solid var(--gold);min-width:132px}
    .mt-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
    .mt-trm .mt-label{color:var(--gold)}
    .mt-row{display:flex;align-items:baseline;gap:7px;margin-top:2px}
    .mt-price{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
    .mt-trm .mt-price{color:var(--gold);font-size:16px}
    .mt-chg{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
    .up{color:var(--go)}.down{color:var(--down)}.flat{color:var(--mut)}
    .mt-meta{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-left:auto;flex-shrink:0;font-size:11px;color:var(--mut);border-left:1px solid var(--line)}
    .mt-meta a{color:var(--gold);text-decoration:none}
  </style>
</head>
<body>
  <header class="mt-banner" role="region" aria-label="Cinta macro TRM y mercados">
    <div class="mt-inner" id="macro-ticker" data-src="data/macro.json">
      <div class="mt-item" style="color:var(--mut);padding:12px 14px">Cargando…</div>
    </div>
  </header>
  <script src="ticker.js"></script>
  <script>MacroTicker.boot("macro-ticker","data/macro.json");</script>
</body>
</html>
