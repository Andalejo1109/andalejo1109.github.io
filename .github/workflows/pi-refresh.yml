name: Refrescar métricas PI

on:
  schedule:
    # Sábados 07:00 America/Bogota = 12:00 UTC (Colombia no tiene DST)
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar pi/stats.json
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
        run: python3 pi/fetch_pi.py
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pi/stats.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(pi): refrescar métricas públicas eToro"
            git push
          fi
