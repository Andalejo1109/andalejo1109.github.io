<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1410" />
  <title>RutaMercado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root { --bg:#0f1410; --bg2:#171e19; --card:#1c241e; --line:#2a352c; --text:#e8efe6; --muted:#9aab9c; --green:#8fd18a; --amber:#e8c36a; --blue:#7eb8c9; --chip:#243028; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--text); font-family:"DM Sans",system-ui,sans-serif; min-height:100%; }
    body { padding:16px 16px calc(28px + env(safe-area-inset-bottom)); max-width:540px; margin:0 auto; }
    header { padding:6px 2px 14px; }
    .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
    h1 { font-family:Fraunces,Georgia,serif; font-size:28px; line-height:1.1; margin:6px 0 10px; }
    .totals { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
    .stat b { display:block; font-size:13px; font-variant-numeric:tabular-nums; }
    .stat span { color:var(--muted); font-size:10px; }
    .progress { height:6px; background:#243028; border-radius:99px; overflow:hidden; margin-top:12px; }
    .progress > i { display:block; height:100%; background:linear-gradient(90deg,#6cbc6a,#c9e38a); width:0; }
    .tabs { display:flex; gap:6px; overflow-x:auto; padding:12px 0 14px; scrollbar-width:none; }
    .tabs button { border:1px solid var(--line); background:var(--bg2); color:var(--text); border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer; }
    .tabs button.on { background:var(--green); color:#102010; border-color:var(--green); }
    .store { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
    .store-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:8px; }
    .store-head h2 { font-size:16px; }
    .store-head small { color:var(--muted); display:block; margin-top:2px; font-size:12px; }
    .money { font-variant-numeric:tabular-nums; color:var(--amber); font-weight:700; font-size:14px; }
    .item { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:start; padding:10px 0; border-top:1px solid var(--line); }
    .item:first-of-type { border-top:0; }
    .check { width:22px; height:22px; border-radius:7px; border:2px solid #4a5c4c; background:transparent; cursor:pointer; margin-top:1px; }
    .item.done .check { background:var(--green); border-color:var(--green); }
    .item.done .name { text-decoration:line-through; color:var(--muted); }
    .name { font-size:14px; font-weight:600; }
    .meta { color:var(--muted); font-size:12px; margin-top:2px; }
    .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:999px; background:var(--chip); color:var(--muted); margin-left:4px; }
    .badge.new { background:#1c3338; color:var(--blue); }
    .badge.pend { background:#3a2220; color:#f0b0a6; }
    .ghost,.primary,.file-btn { border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; padding:8px 12px; }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
    .primary,.file-btn { background:var(--green); color:#102010; border:0; display:inline-block; }
    .tiny { font-size:11px; padding:4px 7px; }
    .add-box { display:flex; gap:8px; margin:8px 0 4px; }
    .add-box input, input[type="number"], input[type="text"], select { background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 10px; font:inherit; font-size:14px; }
    .add-box input { flex:1; }
    .hint { color:var(--muted); font-size:12px; margin:6px 2px 14px; line-height:1.45; }
    .empty { color:var(--muted); padding:8px 0; font-size:14px; }
    .thumb { width:100%; max-height:180px; object-fit:cover; border-radius:12px; margin-top:8px; border:1px solid var(--line); }
    .ocr-line { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
    .footer-note { color:var(--muted); font-size:11px; text-align:center; margin-top:18px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .status { color:var(--amber); font-size:12px; min-height:16px; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Checklist de mercado</div>
    <h1>RutaMercado</h1>
    <div class="totals">
      <div class="stat"><b id="cPend">0</b><span>Pendientes</span></div>
      <div class="stat"><b id="cDone">0</b><span>Llevados</span></div>
      <div class="stat"><b id="cNew">0</b><span>Nuevos</span></div>
      <div class="stat"><b id="cSpent">$0</b><span>Gastado</span></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="app"></div>
  <p class="footer-note">Datos solo en este teléfono · Completitud por sitio</p>
  <script src="./app.js"></script>
</body>
</html>
