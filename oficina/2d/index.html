function panel(x,y,w,h,title,accent,right){
  rect(x+2,y+h,w,2,'rgba(120,92,50,0.18)'); rect(x+w,y+2,2,h,'rgba(120,92,50,0.14)');
  rect(x,y,w,h,C.panel); frame(x,y,w,h,C.line2);
  rect(x,y,3,3,accent); rect(x+w-3,y,3,3,accent);
  rect(x+1,y+1,w-2,1,'rgba(255,255,255,0.55)');
  rect(x,y,w,11,C.panel2); rect(x,y+11,w,1,C.line);
  rect(x+5,y+4,4,4,accent);
  T(title,x+13,y+8,7,C.txt,'left',true);
  if(right)T(right,x+w-5,y+8,7,C.dim,'right');
}
function tile(x,y,w,h,gn){
  rect(x,y,w,h,C.deep);
  if(gn){for(let i=1;i<gn;i++)rect(x+1,y+Math.round(i*h/gn),w-2,1,'rgba(255,255,255,0.05)');}
  frame(x,y,w,h,C.dline);
}
let CHIPS=[];
function place(x,y,w,h){
  for(let t=0;t<4;t++){
    let hit=false;
    for(const r of CHIPS){ if(x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y){hit=true;break;} }
    if(!hit)break; y+=10;
  }
  CHIPS.push({x,y,w,h}); return y;
}
function chip(x,y,w,h,ac){rect(x,y,w,h,C.cream);frame(x,y,w,h,C.line2);rect(x,y,2,h,ac);}
function hbar(x,y,w,h,p,col,bgc){rect(x,y,w,h,bgc||C.track);rect(x,y,Math.max(1,Math.round(w*Math.max(0,Math.min(1,p)))),h,col);}

function deskLive(a){const m=MODE.of(a.bid); let t=a.homeD;
  if(m!=='work'){const sp=(a.s==='c'?SPOTS_C:SPOTS_T).filter(p=>p.n===(m==='cafe'?'CAFÉ':'REUNIÓN')); if(sp.length)t={seat:{x:sp[0].x,y:sp[0].y}};}
  let off=0; if(m==='meet'){const M=MODE.meeting(); off=M&&M.to===a.bid?12:-12;}
  a.lmode=m; a.tx=t.seat.x+off+(Math.random()-.5)*(m==='work'?4:10); a.ty=t.seat.y+(m==='work'?0:(Math.random()-.5)*6);
  if(m==='work'&&DESKS.indexOf(a.at)<0)a.at=a.homeD;
  a.state='walk'; a.timer=3+Math.random()*4;}
function step(dt){
  TIME+=dt; session.min+=dt*1.6;
  tickerX+=dt*18;
  histAcc+=dt;
  if(histAcc>=0.25){histAcc=0;
    plat.forEach(p=>{p.hist.push(p.hist[p.hist.length-1]+rnd()*3-0.9); if(p.hist.length>20)p.hist.shift();});
  }
  clips.forEach(c=>{c.p+=c.sp*dt; if(c.p>=1){c.p=0;c.st=pick(['RENDER','SUBIR','SUBS','COLOR']);clipsDone++;}});
  kw.forEach(k=>{if(rnd()<0.18*dt){const nd=ri(-2,3);k.r=Math.max(1,k.r-nd);k.d=nd;}});
  plat.forEach(p=>{if(rnd()<0.3*dt){p.posts++;p.fl=0.5;posts++;}p.views+=rnd()*1.8*dt;p.fl=Math.max(0,p.fl-dt);});
  // grok
  GROK.bob=Math.sin(TIME*2)*1; GROK.sayT-=dt;
  if(GROK.sayT<=0&&!DEMO&&LIVE){GROK.sayT=9;}
  if(GROK.sayT<=0&&DEMO){GROK.say=pick(GROK_LINES);GROK.sayT=3.2+rnd()*2.4;}
  // agents
  AGENTS.forEach(a=>{
    if(a.state==='work'){
      a.timer-=dt; a.prog=Math.min(1,a.prog+dt/ (a.mini?4:5));
      if(a.timer<=0&&LIVE&&typeof MODE!=='undefined'){deskLive(a);return;}
      if(a.timer<=0){
        const done=a.task[0];
        if(DEMO)push(a.s,a.r,done+' — '+(a.s==='c'?pick(['PUBLICADO','EN COLA','APROBADO','EXPORTADO','GRABADO']):pick(['ENTREGADO','REVISADO','ACTUALIZADO','ENVIADO','LISTO'])));
        // choose next target
        if(a.at)a.at.by=undefined;
        const spots=a.s==='c'?SPOTS_C:SPOTS_T;
        const freeD=DESKS.filter(d=>d.side===a.s&&d.by===undefined);
        const freeS=spots.filter(sp=>sp.by===undefined);
        let t;
        if((rnd()<0.32&&freeS.length)||!freeD.length){
          const sp=pick(freeS.length?freeS:spots); sp.by=a.id;
          t={label:sp.n,seat:{x:sp.x,y:sp.y},ref:sp};
        } else { const d2=pick(freeD); d2.by=a.id; t=d2; }
        a.at=t.ref||t; a.tx=t.seat.x+(rnd()-0.5)*14; a.ty=t.seat.y+(rnd()-0.5)*8;
        a.state='walk'; if(DEMO)a.task=pick(a.tasks||(a.s==='c'?TASKS_C:TASKS_T)); a.prog=0;
      }
    } else {
      const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
      if(d<1.2){a.x=a.tx;a.y=a.ty;a.state='work';a.timer=2.5+rnd()*4.5;a.prog=0;}
      else{
        let mx=0,my=0;
        if(Math.abs(dx)>1.0){mx=Math.sign(dx)*a.sp*dt*60;}
        else{my=Math.sign(dy)*a.sp*dt*60;}
        if(Math.abs(dx)<=1.0&&Math.abs(dy)<=1.0){a.x=a.tx;a.y=a.ty;}
        a.x+=mx; a.y+=my;
        const b=bounds(a.s);
        a.x=Math.max(b.x0,Math.min(b.x1,a.x)); a.y=Math.max(b.y0,Math.min(b.y1,a.y));
        if(mx!==0)a.flip=mx<0;
        a.leg+=dt*10;
      }
    }
  });
}

/* ================= API EN VIVO =================
   Datos reales: feed.json embebido en el build (tools/update_feed.py) o ?feed=URL&poll=60000.
   Esquema: {updated_at, bots:[{id,status,last_task,last_delivery_at}],
             events:[{agent,task,msg,at}], stats:{copiers,auc_tier,posts_queue,videos_queue,digest_ok,cinta_ok}}
   Consola: OFFICE.event({agent:'etoro',msg:'POST PI LISTO'}) · OFFICE.stats({copiers:60})
            OFFICE.addAgent({name,role,floor,sprite}) · OFFICE.say('HOLA') · OFFICE.demo(true)
================================================= */
const OFFICE={
  find(name){ return AGENTS.find(a=>a.bid===String(name).toLowerCase()||a.n.toUpperCase()===String(name).toUpperCase()
                              || a.r.toUpperCase()===String(name).toUpperCase()); },
  event(e){
    const a=this.find(e.agent);
    if(a){ if(e.task){a.task=[String(e.task).toUpperCase(),''];a.prog=0;} if(e.state==='walking')a.state='walk'; }
    const tt=e.at?fmtAt(e.at).split(' ').pop():null;
    push(a?a.s:(e.floor==='trading'?'t':'c'), (e.who||(a?a.r:'SISTEMA')).toUpperCase(),
         String(e.msg||e.task||'').toUpperCase());
    return true;
  },
  stats(o){ Object.assign(ST,o||{}); },
  rename(oldName,newName,newRole){
    const a=this.find(oldName); if(!a)return false;
    if(newName)a.n=newName.toUpperCase(); if(newRole)a.r=newRole.toUpperCase(); return true;
  },
  addAgent(o){ const a=addAgent(o||{}); push(a.s,'SISTEMA','NUEVO BOT: '+a.n+' → '+a.at.label); return {name:a.n,desk:a.at.label}; },
  say(text){ GROK.say=String(text).toUpperCase(); GROK.sayT=6; },
  demo(on){ DEMO=!!on; return DEMO; },
  agents(){ return AGENTS.map(a=>({name:a.n,role:a.r,floor:a.s==='c'?'content':'data',state:a.state})); }
};
window.OFFICE=OFFICE;

function applyFeed(d){
  if(!d||typeof d!=='object')return false;
  if(d.stats)OFFICE.stats(d.stats);
  (d.bots||[]).forEach(b=>{ if(!b.id)return; BSTATE[b.id]=b;
    const a=AGENTS.find(q=>q.bid===b.id); if(a&&b.last_task){a.task=[String(b.last_task).toUpperCase().slice(0,16),''];}
    if(b.id==='chief'&&b.last_task)GROK.say=String(b.last_task).toUpperCase().slice(0,26); });
  const ev=(d.events||[]).slice().sort((x,y)=>String(x.at||'').localeCompare(String(y.at||'')));
  feed.length=0;
  ev.forEach(e=>{const a=OFFICE.find(e.agent||''); feed.unshift({t:e.at?fmtAt(e.at):'',s:a?a.s:'c',w:(a?a.n:String(e.agent||'SISTEMA')).toUpperCase(),m:String(e.msg||e.task||'').toUpperCase()}); if(feed.length>14)feed.pop();});
  window.__FEED=d; FEED_AT=d.updated_at?fmtAt(d.updated_at):'—'; window.__FEED_T=d.updated_at?new Date(d.updated_at).getTime():null; LIVE=true; DEMO=false; return true;
}

/* ---------- estado por bot (desde feed.json) ---------- */
const MODE=(function(){
  const ref=()=>window.__FEED_T||Date.now(), T0=performance.now()/1000; let forced=null;
  function handoffs(){const h=(window.__FEED&&window.__FEED.handoffs)||[];
    return h.filter(x=>x&&x.from&&x.to&&ref()-new Date(x.ts)<864e5).sort((a,b)=>new Date(b.ts)-new Date(a.ts));}
  function meeting(){const now=performance.now()/1000; if(forced&&now<forced.until)return forced.h;
    const H=handoffs(); if(!H.length)return null; const t=now-T0, k=Math.floor(t/36)%H.length; return (t%36)<22?H[k]:null;}
  function of(id){const m=meeting(); if(m&&(m.from===id||m.to===id))return 'meet';
    if(!LIVE)return 'work';
    const st=BSTATE[id]||{}; if(/trabaj|en curso|ejecut|running|rutina/i.test(st.status||''))return 'work';
    const d=st.last_delivery_at?new Date(st.last_delivery_at):null, r=new Date(ref());
    if(d&&(r-d<72e5||d.toDateString()===r.toDateString()))return 'work';
    return 'cafe';}
  const LBL={work:'Trabajando',cafe:'En el café',meet:'En reunión'};
  return {of,meeting,handoffs,label:id=>LBL[of(id)],force(f,t,label,sec){forced={h:{from:f,to:t,label:label||'prueba'},until:performance.now()/1000+(sec||30)};}};
})();
window.__meet=(f,t,l,s)=>MODE.force(f,t,l,s);
const CONF=(function(){
  const B={}; let seen={}; try{seen=JSON.parse(localStorage.getItem('gbo_seen')||'{}');}catch(e){}
  function check(){let ch=false; for(const id in BSTATE){const t=BSTATE[id].last_delivery_at; if(!t)continue;
